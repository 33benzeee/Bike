<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<title>Wheelie Works</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="copflash"></div>

  <div id="hud" class="hidden">
    <div class="tl">
      <div id="cash">$0</div>
      <div id="heat"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="evade" class="pill hidden"><span>LOSE THEM</span><div class="bar"><b></b></div></div>
      <div id="trk" class="pill hidden"><span></span></div>
      <div id="burn" class="pill hidden"><span>BURNOUT MODE — HOLD THROTTLE, STEER TO SPIN</span></div>
      <div id="eye" class="pill hidden"><span>COPS WATCHING</span><div class="bar"><b></b></div></div>
    </div>
    <div class="tr">
      <canvas id="minimap" width="340" height="340"></canvas>
      <div class="btns">
        <button id="btn-cam" aria-label="Change camera">CAM</button>
        <button id="btn-pause" aria-label="Pause">II</button>
      </div>
      <div id="camname"></div>
    </div>
    <div id="combo" class="hidden">
      <div class="label"></div>
      <div class="score"><span class="pts">0</span><span class="mult">x1</span></div>
      <div class="bar"><b></b></div>
    </div>
    <div id="popups"></div>
    <div class="bc">
      <div id="meter" class="hidden">
        <div class="track"><div class="zone"></div><div class="danger"></div><div class="needle"></div></div>
        <div class="cap">BALANCE</div>
      </div>
      <div id="speed"><span class="num">0</span><span class="unit">MPH</span></div>
    </div>
    <div id="bust" class="hidden"><span>BUSTED</span><div class="bar"><b></b></div></div>
    <div id="banner"></div>
    <div id="hint"></div>
  </div>
  <div id="toasts"></div>

  <div id="touch" class="hidden">
    <div id="stickzone"></div>
    <div id="stick"><div class="knob"></div></div>
    <div id="tricks">
      <button data-t="0">ONE<br>HAND</button>
      <button data-t="1">NO<br>HANDS</button>
      <button data-t="2">SEAT<br>STAND</button>
      <button data-t="3">FOOT<br>DRAG</button>
    </div>
    <button id="t-wheelie">WHEELIE</button>
    <button id="t-stoppie">STOPPIE</button>
    <button id="t-hop">HOP</button>
    <button id="t-brake">BRAKE</button>
    <button id="t-gas">GAS</button>
    <button id="t-reset">RESET</button>
    <button id="t-mount" class="hidden">GET ON</button>
    <button id="t-burn">BURNOUT</button>
  </div>

  <div id="screens"></div>

  <div id="rotate"><div><div class="phone"></div><p>Rotate your phone to landscape</p><button id="rotate-skip">Play upright anyway</button></div></div>
  <div id="loading"><div class="logo">WHEELIE<span>WORKS</span></div><p>Building the city…</p></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
